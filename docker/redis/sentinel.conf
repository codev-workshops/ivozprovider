protected-mode no
port 26379
# Sentinel hands this address out to clients, so it has to be the address of
# this container on the compose network: the kamailio proxies ask sentinel for
# the master and would otherwise be sent to their own 127.0.0.1.
sentinel monitor mymaster 10.189.4.11 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
sentinel resolve-hostnames no
sentinel announce-hostnames no