protected-mode no
port 26379
# The monitored address is what sentinel hands back to clients, so it has to be
# reachable from the other containers, not just from inside this one.
sentinel monitor mymaster 10.189.4.11 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
sentinel resolve-hostnames no
sentinel announce-hostnames no