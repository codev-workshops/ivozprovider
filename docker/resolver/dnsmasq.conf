# ivozprovider.local zone for the compose stack.
#
# Equivalent of profiles/data/etc/bind/db.ivozprovider.local, with every A
# record pointing at the fixed compose address of the matching service instead
# of 127.0.0.1.

no-resolv
no-hosts
bind-interfaces
listen-address=0.0.0.0

# Be authoritative for the zone: without this dnsmasq has no upstream to
# forward to and answers REFUSED to everything that is not an A query, and
# pjproject (bbs) aborts a request when the SRV lookup for the SIP domain is
# refused instead of falling back to the A record.
local=/ivozprovider.local/

address=/users.ivozprovider.local/10.189.4.40
address=/trunks.ivozprovider.local/10.189.4.41
address=/as.ivozprovider.local/10.189.4.42
address=/media.ivozprovider.local/10.189.4.43
address=/data.ivozprovider.local/10.189.4.10
address=/cache.ivozprovider.local/10.189.4.11
address=/storage.ivozprovider.local/10.189.4.10
address=/logs.ivozprovider.local/10.189.4.10
address=/jobs.ivozprovider.local/10.189.4.20
address=/hep.ivozprovider.local/10.189.4.20
address=/backend.ivozprovider.local/10.189.4.20

# SIP domains served by the users proxy: the vPBX company domain and the brand
# domain used by the residential device and the retail account
# (tests/bbs/environment.yaml).
address=/bbs.ivozprovider.local/10.189.4.40
address=/brand-bbs.ivozprovider.local/10.189.4.40
