services:
  data:
    build:
      context: .
      dockerfile: docker/mariadb/Dockerfile
    entrypoint: docker-entrypoint.sh
    command: mariadbd
    container_name: ivozprovider-data
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: ivozprovider
      MYSQL_USER: regular
      MYSQL_PASSWORD: changeme
    networks:
      network:
        ipv4_address: 10.189.4.10
        aliases:
          - data
          - data.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u regular -pchangeme"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

  redis:
    hostname: ivozprovier-redis
    container_name: ivozprovider-redis
    image: ivozprovider-redis:local
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    networks:
      network:
        ipv4_address: 10.189.4.11
        aliases:
          - cache
          - cache.ivozprovider.local
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    hostname: ivozprovier-backend
    command: /bin/bash /var/run/start.sh
    container_name: ivozprovider-backend
    image: ivozprovider-backend:local
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        NAME: ivozprovider
        XDEBUG: true
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    volumes:
      - .:/opt/irontec/ivozprovider
      - storage:/opt/irontec/ivozprovider/storage
      - ~/.cache/composer:/home/docker/.cache/composer
    depends_on:
      data:
        condition: service_healthy
      redis:
        condition: service_healthy
    links:
      - data:data.ivozprovider.local
      - redis:cache.ivozprovider.local
    extra_hosts:
      xdebug: 10.189.4.1
    networks:
      network:
        ipv4_address: 10.189.4.20
        aliases:
          - backend
          - backend.ivozprovider.local
          - storage.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  portal-platform:
    hostname: ivozprovider-portal-platform
    command: /bin/bash /var/run/start.sh platform
    container_name: ivozprovider-portal-platform
    image: ivozprovider-portal:local
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend.ivozprovider.local/
    volumes:
      - .:/opt/irontec/ivozprovider
      - ../ivoz-ui/:/opt/ivoz-ui
    depends_on:
      backend:
        condition: service_healthy
    links:
      - backend:backend.ivozprovider.local
    networks:
      network:
        ipv4_address: 10.189.4.30

  portal-brand:
    hostname: ivozprovider-portal-brand
    command: /bin/bash /var/run/start.sh brand
    container_name: ivozprovider-portal-brand
    image: ivozprovider-portal:local
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend.ivozprovider.local/
    volumes:
      - .:/opt/irontec/ivozprovider
      - ../ivoz-ui/:/opt/ivoz-ui
    depends_on:
      backend:
        condition: service_healthy
    links:
      - backend:backend.ivozprovider.local
    networks:
      network:
        ipv4_address: 10.189.4.31

  portal-client:
    hostname: ivozprovider-portal-client
    command: /bin/bash /var/run/start.sh client
    container_name: ivozprovider-portal-client
    image: ivozprovider-portal:local
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend.ivozprovider.local/
    volumes:
      - .:/opt/irontec/ivozprovider
      - ../ivoz-ui/:/opt/ivoz-ui
    depends_on:
      backend:
        condition: service_healthy
    links:
      - backend:backend.ivozprovider.local
    networks:
      network:
        ipv4_address: 10.189.4.32

  portal-user:
    hostname: ivozprovider-portal-user
    command: /bin/bash /var/run/start.sh user
    container_name: ivozprovider-portal-user
    image: ivozprovider-portal:local
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend.ivozprovider.local/
    volumes:
      - .:/opt/irontec/ivozprovider
      - ../ivoz-ui/:/opt/ivoz-ui
    depends_on:
      backend:
        condition: service_healthy
    links:
      - backend:backend.ivozprovider.local
    networks:
      network:
        ipv4_address: 10.189.4.33

  # ---------------------------------------------------------------------------
  # SIP/media plane. These four run the same packages as a real deployment
  # (packages.irontec.com, suite tempest); their entrypoints reproduce the
  # configuration that the ivozprovider-profile-proxy / -profile-as postinst
  # scripts apply from debconf. See doc/legacy-baseline.md.
  # ---------------------------------------------------------------------------
  kamailio-users:
    hostname: proxyusers
    container_name: ivozprovider-kamailio-users
    image: ivozprovider-legacy-kamailio:local
    build:
      context: .
      dockerfile: docker/legacy/kamailio/Dockerfile
    command: ["users"]
    environment:
      MYSQL_HOST: data.ivozprovider.local
      MYSQL_PASSWORD: changeme
    depends_on:
      data:
        condition: service_healthy
      redis:
        condition: service_healthy
      # autoconf reads columns (ProxyUsers.advertisedIp) that only exist once
      # the Doctrine migrations run, which start.sh does before apache comes up.
      backend:
        condition: service_healthy
    networks:
      network:
        ipv4_address: 10.189.4.40
        aliases:
          # autoconf writes `listen=udp:users:SIP_PORT` for the id=1 socket, so
          # the bare `users` name has to resolve inside the container too.
          - users
          - users.ivozprovider.local
          # SIP domains the tests/bbs users register against.
          - bbs.ivozprovider.local
          - brand-bbs.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "kamcmd -s unix:/run/kamailio/kamailio_proxyusers_ctl core.uptime > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kamailio-trunks:
    hostname: proxytrunks
    container_name: ivozprovider-kamailio-trunks
    image: ivozprovider-legacy-kamailio:local
    build:
      context: .
      dockerfile: docker/legacy/kamailio/Dockerfile
    command: ["trunks"]
    environment:
      MYSQL_HOST: data.ivozprovider.local
      MYSQL_PASSWORD: changeme
    depends_on:
      data:
        condition: service_healthy
      redis:
        condition: service_healthy
      # autoconf reads columns (ProxyUsers.advertisedIp) that only exist once
      # the Doctrine migrations run, which start.sh does before apache comes up.
      backend:
        condition: service_healthy
    networks:
      network:
        ipv4_address: 10.189.4.41
        aliases:
          - trunks
          - trunks.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "kamcmd -s unix:/run/kamailio/kamailio_proxytrunks_ctl core.uptime > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  asterisk:
    hostname: as001
    container_name: ivozprovider-asterisk
    image: ivozprovider-legacy-asterisk:local
    build:
      context: .
      dockerfile: docker/legacy/asterisk/Dockerfile
    environment:
      MYSQL_HOST: data.ivozprovider.local
      MYSQL_PASSWORD: changeme
    volumes:
      - storage:/opt/irontec/ivozprovider/storage
    depends_on:
      data:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      network:
        ipv4_address: 10.189.4.42
        aliases:
          - as001
          - as001.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core waitfullybooted' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rtpengine:
    hostname: rtpengine
    container_name: ivozprovider-rtpengine
    image: ivozprovider-legacy-rtpengine:local
    build:
      context: .
      dockerfile: docker/legacy/rtpengine/Dockerfile
    environment:
      MEDIA_RELAY_ADDRESS: 10.189.4.43
      MEDIA_RELAY_CONTROL: 10.189.4.43
      MEDIA_RELAY_MINPORT: 13000
      MEDIA_RELAY_MAXPORT: 13500
    volumes:
      - storage:/opt/irontec/ivozprovider/storage
    networks:
      network:
        ipv4_address: 10.189.4.43
        aliases:
          - rtpengine
          - rtpengine.ivozprovider.local
    healthcheck:
      test: ["CMD-SHELL", "rtpengine-ctl -i 127.0.0.1:9900 list numsessions > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.189.4.0/24

volumes:
  dbdata:
  # /opt/irontec/ivozprovider/storage is NFS on a real deployment: recordings
  # written by rtpengine/asterisk are read back by the API.
  storage:
